services:
  # =========================================
  # Go REST API Application Service
  # =========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang_api_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=golang_restapi_big_structure
      - JWT_SECRET=SUPER_SECRET_KEY_FOR_DOCKER
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # =========================================
  # MySQL Database Service
  # =========================================
  db:
    image: mysql:8.0
    container_name: golang_api_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: golang_restapi_big_structure
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  db_data:
